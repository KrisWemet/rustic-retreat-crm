name: Supabase Migrations

# Applies migrations to the production CRM database. Runs only when started
# by hand from master. The final step waits for approval on the `production`
# environment; configure its required reviewers in the repository settings
# (see supabase/README.md) or the approval pause will not happen.

on:
  workflow_dispatch:

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  verify:
    name: Verify migrations on a disposable database
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Production migrations run only from master. This run was started from ${GITHUB_REF_NAME}."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run database checks
        run: bash supabase/tests/run.sh

  preview:
    name: Preview pending production migrations
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Link remote project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Missing required secrets. Set SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD." && exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -o pipefail
          supabase db push --dry-run 2>&1 | tee dry-run.txt
          {
            echo "## Pending production migrations"
            echo
            echo "Review this list before approving the **Apply** job."
            echo
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Apply migrations to production
    needs: preview
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Link remote project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Missing required secrets. Set SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD." && exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
